[package]
name = "deps"
version = "0.1.0"
edition.workspace = true
description = "The dependency checks: latest versions at least 7 days old, and unused files, exports and dev packages (EN-109)"
license.workspace = true
publish.workspace = true

[dependencies]
hooks = { path = "../hooks" }
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true
serde_json.workspace = true
tool-use = { path = "../tool-use" }

[dev-dependencies]
test-support = { path = "../test-support" }

[lints]
workspace = true

# `deps` is a folder of Cargo's build directory, refused as a binary's name.
[[bin]]
name = "dependencies"
path = "src/main.rs"
