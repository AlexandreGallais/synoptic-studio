[package]
name = "library"
version = "0.1.0"
edition.workspace = true
description = "The local source library: its MCP server and its command line (ADR-0039, EN-106)"
license.workspace = true
publish.workspace = true

[dependencies]
rmcp.workspace = true
serde_json.workspace = true
tokio.workspace = true

# SQLite compiled into the binary, FTS5 included, except for the Windows check of check:rust, whose
# C toolchain is missing on this machine: there the system's SQLite is linked (research note 0025).
[target.'cfg(not(windows))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
rusqlite.workspace = true

[lints]
workspace = true
