[package]
name = "knowledge"
version = "0.1.0"
edition.workspace = true
description = "The project's records in one SQLite file, its knowledge tables first (E49, EN-151)"
license.workspace = true
publish.workspace = true

[dependencies]
git-repository = { path = "../git-repository" }
tool-use = { path = "../tool-use" }

# SQLite compiled into the binary, FTS5 included, except for the Windows check of check:rust, whose
# C toolchain is missing on this machine: there the system's SQLite is linked, as for the library.
[target.'cfg(not(windows))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
rusqlite.workspace = true

[dev-dependencies]
test-support = { path = "../test-support" }

[lints]
workspace = true
