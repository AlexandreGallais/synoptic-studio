# Autonomous runs (ADR-0028, ADR-0045, ADR-0086): merges, always by a merge commit, a pull request
# labeled `autonomous` — a story into its feature branch (`feature/f22-…`), or into `develop` a
# feature branch or a review (`…/rev-…`, ADR-0086, decision 8). Their checks ran
# locally before the push (pre-push hook, `check:all`): no CI runs on them. Nothing reaches `main`
# this way: the Product Owner merges it after each review. The agent never merges; removing the
# label before the merge stops it.
name: Story auto-merge

on:
  pull_request:
    types: [labeled, opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Merge
    if: >-
      contains(github.event.pull_request.labels.*.name, 'autonomous')
      && github.event.pull_request.author_association == 'OWNER'
      && (startsWith(github.event.pull_request.base.ref, 'feature/')
        || github.event.pull_request.base.ref == 'develop')
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch is a story or a feature allowed in autonomous runs
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE" = develop ]; then
            allowed='^(feature/f[0-9]{2}-|[a-z]+/rev-[0-9]{3}-)'
            kinds='a feature branch or a REV'
          else
            allowed='^[a-z]+/(us|en|sp|chk|aud|val)-[0-9]{3}-'
            kinds='a US, EN, SP, CHK, AUD or VAL branch'
          fi
          if ! printf '%s' "$BRANCH" | grep -Eq "$allowed"; then
            echo "Branch $BRANCH into $BASE is not $kinds: no auto-merge (ADR-0028, ADR-0045, ADR-0086)."
            exit 1
          fi
      - name: Merge (merge commit)
        env:
          # Built-in token: a merge into a feature branch or develop needs no release, hence no
          # personal token.
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # GitHub computes the mergeability of a new pull request after a few seconds: retry.
        run: |
          for attempt in 1 2 3 4 5; do
            gh pr merge "$PR_URL" --auto --merge && exit 0
            echo "Attempt $attempt: not mergeable yet."
            sleep 10
          done
          exit 1
