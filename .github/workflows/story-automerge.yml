# Autonomous runs (ADR-0028, ADR-0045, ADR-0086): merges into `develop` by a merge commit a pull
# request labeled `autonomous` from a story's branch (`<type>/<id>-<topic>`), one loop per story in
# the graph. Its checks ran locally before the push (pre-push hook, `check:all`): no CI runs on it.
# Nothing reaches `main` this way: a reviewed feature is merged by the Product Owner. The agent
# never merges; removing the label before the merge stops it.
name: Story auto-merge

on:
  pull_request:
    types: [labeled, opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Merge
    if: >-
      contains(github.event.pull_request.labels.*.name, 'autonomous')
      && github.event.pull_request.author_association == 'OWNER'
      && github.event.pull_request.base.ref == 'develop'
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch is a story allowed in autonomous runs
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^[a-z]+/(us|en|sp|chk|aud|val|nam|rev|ret)-[0-9]{3}-'; then
            echo "Branch $BRANCH is not a US, EN, SP, CHK, AUD, VAL, NAM, REV or RET branch: no auto-merge (ADR-0028, ADR-0045, ADR-0086)."
            exit 1
          fi
      - name: Merge (merge commit)
        env:
          # Built-in token: a merge into develop needs no release, hence no personal token.
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # GitHub computes the mergeability of a new pull request after a few seconds: retry.
        run: |
          for attempt in 1 2 3 4 5; do
            gh pr merge "$PR_URL" --auto --merge && exit 0
            echo "Attempt $attempt: not mergeable yet."
            sleep 10
          done
          exit 1
