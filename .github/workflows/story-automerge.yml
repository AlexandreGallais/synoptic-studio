# Autonomous runs (ADR-0028, ADR-0045, ADR-0086): merges, always by a merge commit, a pull request
# labeled `autonomous` — a story into its feature branch (`feature/f22-…`), or into `develop` a
# feature branch or a review (`…/rev-…`, ADR-0086, decision 4). Their checks ran
# locally before the push (pre-push hook, `check:all`): no CI runs on them; once merged into
# `develop`, it dispatches the develop CI, which blocks nothing (ADR-0088). Nothing reaches `main`
# this way: the Product Owner merges it after each review. The agent never merges; removing the
# label before the merge stops it.
name: Story auto-merge

on:
  pull_request:
    types: [labeled, opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  # The dispatch of the develop CI (`REF-GH-REST-WORKFLOW-DISPATCH`), its only addition (EN-135).
  actions: write

jobs:
  auto-merge:
    name: Merge
    if: >-
      contains(github.event.pull_request.labels.*.name, 'autonomous')
      && github.event.pull_request.author_association == 'OWNER'
      && (startsWith(github.event.pull_request.base.ref, 'feature/')
        || github.event.pull_request.base.ref == 'develop')
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch is a story or a feature allowed in autonomous runs
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE" = develop ]; then
            allowed='^(feature/f[0-9]{2}-|[a-z]+/rev-[0-9]{3}-)'
            kinds='a feature branch or a REV'
          else
            allowed='^[a-z]+/(us|en|sp|chk|aud|val)-[0-9]{3}-'
            kinds='a US, EN, SP, CHK, AUD or VAL branch'
          fi
          if ! printf '%s' "$BRANCH" | grep -Eq "$allowed"; then
            echo "Branch $BRANCH into $BASE is not $kinds: no auto-merge (ADR-0028, ADR-0045, ADR-0086)."
            exit 1
          fi
      - name: Merge (merge commit), then start the develop CI
        env:
          # Built-in token: a merge into a feature branch or develop needs no release, hence no
          # personal token.
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE: ${{ github.event.pull_request.base.ref }}
        # GitHub computes the mergeability of a new pull request after a few seconds: retry. With
        # `--auto`, a pull request not yet mergeable gets the auto-merge only, merged later
        # (`REF-GH-CLI-MERGE`), and `gh pr merge` then refuses it, already merged: each attempt
        # reads its state (`REF-GH-CLI-PR-VIEW`). Merged into develop, it dispatches the develop CI
        # on develop, which this merge's push by the GITHUB_TOKEN does not start
        # (`REF-GH-TOKEN-TRIGGERS`, `REF-GH-CLI-WORKFLOW-RUN`, ADR-0088, decision 5); no merge, no
        # dispatch. The base read here until EN-134 splits this workflow by its base.
        run: |
          for attempt in 1 2 3 4 5; do
            gh pr merge "$PR_URL" --auto --merge || echo "Attempt $attempt: gh pr merge failed."
            if [ "$(gh pr view "$PR_URL" --json state --jq .state)" = MERGED ]; then
              if [ "$BASE" = develop ]; then
                gh workflow run develop-ci.yml --ref develop --repo "$GITHUB_REPOSITORY"
              fi
              exit 0
            fi
            echo "Attempt $attempt: $PR_URL not merged yet."
            sleep 10
          done
          echo "$PR_URL is not merged after 5 attempts: nothing dispatched." >&2
          exit 1
