# Quality gate of the pull requests into main: the only CI run (ADR-0038, docs/tooling/ci.md).
# Work branches (stories, features, develop) are checked locally by the Git hooks. Each lane of
# `check:all` is a job of its own, in parallel, each its own check on the pull request (EN-124).
# Run by hand on a branch (`workflow_dispatch`), it times the lanes alone, cold or on the caches
# (EN-111): the jobs that read a pull request are skipped.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The cargo tools of the Rust checks (EN-069), the versions of docs/tooling/dependencies.md; the
  # same in rust-caches.yml, whose run on a push to develop saves the caches this workflow
  # restores, and in site.yml and release.yml (EN-111, EN-125, EN-132).
  CARGO_LLVM_COV_VERSION: 0.9.1
  CARGO_DENY_VERSION: 0.20.2
  # No incremental build: its state, kept for the workspace's own crates only, would grow the cache
  # and never be reused, those crates being compiled again in each run.
  CARGO_INCREMENTAL: 0

jobs:
  lanes:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Each lane runs to its end, whichever other fails (`REF-GH-JOB-PERMISSIONS`).
      fail-fast: false
      # The lanes of `check:all` (tools/repo-tools/src/check_all.rs), each its scripts in order; the
      # library's build after the docs lane. One job per lane, as `[F24.AC1]` checks.
      matrix:
        include:
          - name: Lint and types
            scripts: lint
          - name: TypeScript tests
            scripts: test
          - name: Docs, playground and build
            scripts: docs:build playground:build build
          - name: Format, secrets and dependencies
            scripts: format:check lint:secrets deps:audit deps:unused deps:outdated
          - name: Rust
            scripts: check:rust
    steps:
      - uses: actions/checkout@v7
      # The caches are restored, never saved: a pull request's cache is scoped to its merge ref, so
      # the next pull request would never restore it (`REF-GH-CACHE`); rust-caches.yml saves them
      # on a push to develop, site.yml main's build on a push to main, and a pull request restores
      # those of its head branch first, then of main: the review's, from develop, develop's
      # (EN-125, EN-132). Their keys are rust-caches.yml's.
      - id: toolchain
        run: echo "name=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)-x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
      # The pinned toolchain, its Windows target and components, and the cargo tools: installed only
      # when a key changes (`REF-GH-CACHE-RESTORE`), by the lanes running them: Rust, and the tests' cargo deny.
      - id: tools
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain.outputs.name }}
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/bin/cargo-deny
          key: rust-tools-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}
      - if: (matrix.scripts == 'check:rust' || matrix.scripts == 'test') && steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }} cargo-deny@${{ env.CARGO_DENY_VERSION }}
      # The crates downloaded and the workspace's build: its dependencies compiled once per
      # Cargo.lock and toolchain, the workspace's own crates again (their checkout is newer).
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-build-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The release binaries every lane's tools run from, built in their own step so that its log
      # names every crate compiled.
      - run: npm run rust:build
      # The history job's binary, from the lint lane's build.
      - if: matrix.scripts == 'lint'
        uses: actions/upload-artifact@v7
        with:
          name: git-hooks
          path: target/release/git-hooks
          if-no-files-found: error
          retention-days: 1
      # Every crate of Cargo.lock, for every target (`REF-CARGO-FETCH`): the build downloads only the
      # host's, but `cargo metadata`, which cargo-deny and `[F19.AC9]` run offline, reads them all;
      # a cache of an older Cargo.lock lacks the new ones (EN-116).
      - run: cargo fetch --locked
      # The RustSec advisories, whose database is fetched here, the pre-push hook reading its local
      # copy offline: by the Rust lane and the test lane, whose `[F19.AC9]` runs cargo deny (EN-126).
      - if: matrix.scripts == 'check:rust' || matrix.scripts == 'test'
        run: cargo deny fetch db
      # The lane's scripts in turn, the first failing one ending the job; their output as it comes,
      # the tests file by file, a failing test annotated at its line (`REF-VITEST-REPORTERS`).
      - run: for script in $SCRIPTS; do npm run "$script"; done
        env:
          SCRIPTS: ${{ matrix.scripts }}
          GITHUB_TOKEN: ${{ github.token }}
          # Test report of the version, attached to its GitHub release by release.yml (ADR-0027).
          VITEST_JUNIT: test-report.xml
      - if: matrix.scripts == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test-report.xml
          if-no-files-found: error

  history:
    name: Commit messages and branch name
    if: ${{ github.event_name == 'pull_request' }}
    needs: lanes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The Rust checks of the Git hooks (EN-108), the binary the lint lane built: the branch name,
      # then each commit's message. An artifact keeps no file mode (`REF-GH-ARTIFACT-MODES`).
      - uses: actions/download-artifact@v8
        with:
          name: git-hooks
          path: target/release
      - run: chmod +x target/release/git-hooks
      - run: target/release/git-hooks branch --name "${{ github.head_ref }}"
      - run: >-
          target/release/git-hooks commits
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  dependencies:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: low
