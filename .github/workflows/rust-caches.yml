# The Rust caches of develop (docs/tooling/ci.md, ADR-0088): a push to develop saves the
# toolchain, the cargo tools and the Rust build the next pull request into main restores (EN-111,
# EN-125). A merge by the auto-merge's token starts no run (`REF-GH-TOKEN-TRIGGERS`): only a
# person's push to develop does, until F30's dispatch. main's build is saved by site.yml.
name: Rust caches

on:
  push:
    branches: [develop]

permissions:
  contents: read

env:
  # The cargo tools of the Rust checks, the same as ci.yml's (EN-069, EN-111).
  CARGO_LLVM_COV_VERSION: 0.9.1
  CARGO_DENY_VERSION: 0.20.2
  # No incremental build: its state, kept for the workspace's own crates only, would grow the cache
  # and never be reused, those crates being compiled again in each run.
  CARGO_INCREMENTAL: 0

jobs:
  # A cache saved by a pull request's run is scoped to its merge ref and never restored by the
  # next pull request; a pull request's run restores those of its head branch, of its base branch
  # and of the default branch, so the review's, from develop into main, those saved on develop
  # first (`REF-GH-CACHE`). It fetches every target's crates, as the CI does before its lanes
  # (`REF-CARGO-FETCH`, EN-116), then builds what `check:all` compiles, with the same commands and
  # flags, and checks nothing: the tests are compiled and listed, never run (ADR-0072: nothing is
  # re-checked after the merge). Its keys and paths are ci.yml's. Without `restore-keys`, a new key
  # starts from an empty target/, which so never keeps the artifacts of an older Cargo.lock.
  rust-caches:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        run: echo "name=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)-x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
      - id: tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain.outputs.name }}
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/bin/cargo-deny
          key: rust-tools-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}
      - if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }} cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # Every crate of Cargo.lock for every target, not the host's alone, which the build fetches:
      # the CI's `cargo metadata --offline` and `cargo deny --offline` read them all (EN-116).
      - run: cargo fetch --locked
      # The compilations of `rust:build` and `check:rust` (package.json): the release binaries,
      # Clippy, the tests under coverage, the Windows check.
      - run: npm run rust:build
      - run: cargo clippy --workspace --all-targets --locked --quiet
      - run: cargo llvm-cov --workspace --locked --no-report -- --list
      - run: cargo check --workspace --all-targets --locked --quiet --target x86_64-pc-windows-msvc
