# The features' auto-merge (ADR-0072, ADR-0086, ADR-0088): merges, always by a merge commit, a
# pull request of the owner labeled `autonomous` into `develop`, from a feature branch, a review
# (`…/rev-…`, ADR-0086, decision 4) or an epic's refinement spike (`…/sp-…`, decided by the
# Product Owner on 2026-10-25, REV-009), then dispatches the develop CI, which blocks nothing
# (ADR-0088, decision 5). A story goes into its feature branch by `story-automerge.yml`; `develop`
# goes into `main` by `main-automerge.yml`, once the Product Owner validated the review (label
# `po-validated`, 2026-10-25). The agent never merges; removing the label before the merge stops it.
name: Feature auto-merge

# The base is chosen by `branches` alone (ADR-0088, decision 2, EN-134). Not `opened`: a pull
# request opened with its label sends `opened` and `labeled`, which started two runs (research
# note 0026, §2); `ready_for_review` merges a draft once it is ready, its `labeled` run skipped.
on:
  pull_request:
    types: [labeled, reopened, ready_for_review]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  # The dispatch of the develop CI (`REF-GH-REST-WORKFLOW-DISPATCH`), its only addition (EN-135).
  actions: write

jobs:
  auto-merge:
    name: Merge
    # A guard on the pull request's label, author and draft state, which no trigger expresses.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'autonomous')
      && github.event.pull_request.author_association == 'OWNER'
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch is a feature, a review or an epic's spike allowed in autonomous runs
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^(feature/f[0-9]{2}-|[a-z]+/rev-[0-9]{3}-|[a-z]+/sp-[0-9]{3}-|[a-z]+/aud-[0-9]{3}-)'; then
            echo "Branch $BRANCH into develop is not a feature branch, a REV, an SP nor an AUD: no auto-merge (ADR-0072, ADR-0086, REV-009)."
            exit 1
          fi
      - name: Merge (merge commit), then start the develop CI
        env:
          # Built-in token: a merge into develop needs no release, hence no personal token.
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # GitHub computes the mergeability of a new pull request after a few seconds: retry. With
        # `--auto`, a pull request not yet mergeable gets the auto-merge only, merged later
        # (`REF-GH-CLI-MERGE`), and `gh pr merge` then refuses it, already merged: each attempt
        # reads its state (`REF-GH-CLI-PR-VIEW`). Merged, it dispatches the develop CI on develop,
        # which this merge's push by the GITHUB_TOKEN does not start (`REF-GH-TOKEN-TRIGGERS`,
        # `REF-GH-CLI-WORKFLOW-RUN`, ADR-0088, decision 5); no merge, no dispatch. A dispatch
        # refused, as it is while develop-ci.yml is not on main, the default branch
        # (`REF-GH-WORKFLOW-DISPATCH`), leaves a warning annotation and the run green, the merge
        # being done (`REF-GH-WORKFLOW-COMMANDS`, EN-136). Not merged after the attempts, the
        # auto-merge `--auto` enabled is disabled before the step fails: GitHub's later merge would
        # be the GITHUB_TOKEN's, starting no develop CI, and a person's merge pushes and starts it
        # (AUD-032).
        run: |
          for attempt in 1 2 3 4 5; do
            gh pr merge "$PR_URL" --auto --merge || echo "Attempt $attempt: gh pr merge failed."
            if [ "$(gh pr view "$PR_URL" --json state --jq .state)" = MERGED ]; then
              if ! gh workflow run develop-ci.yml --ref develop --repo "$GITHUB_REPOSITORY"; then
                echo "::warning::The develop CI was not dispatched: GitHub refused the dispatch, as it does while develop-ci.yml is not yet on main, the default branch; $PR_URL is merged."
              fi
              exit 0
            fi
            echo "Attempt $attempt: $PR_URL not merged yet."
            sleep 10
          done
          gh pr merge "$PR_URL" --disable-auto || echo "The auto-merge of $PR_URL could not be disabled."
          echo "$PR_URL is not merged after 5 attempts: its auto-merge disabled, nothing dispatched; a person's merge starts the develop CI by its push." >&2
          exit 1
