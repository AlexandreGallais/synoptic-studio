# Weekly link check of every Markdown file: sources of docs/references.md and internal links
# (ADR-0022, docs/tooling/ci.md). Exclusions in .lycheeignore.
name: Links

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --max-retries 3
            --root-dir ${{ github.workspace }}/docs
            --exclude-path docs/api --exclude-path node_modules --exclude-path CHANGELOG.md
            --exclude-path docs/backlog/_
            './**/*.md' './.claude/**/*.md'
          fail: true
          jobSummary: true
