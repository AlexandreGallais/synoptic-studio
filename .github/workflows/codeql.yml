# Static security analysis of the TypeScript code and of the workflows (the records' workflows,
# ADR-0072, EN-134): pull requests into main, compared with the analysis of main, refreshed on
# each push to main and weekly.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # One job for both languages, analysed in turn: a job per language would be named
    # `Analyze (<language>)`, and `Analyze` is the check main's ruleset requires (EN-134).
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, actions
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
