# Versioning, changelog and documentation site (docs/tooling/releases.md, ADR-0067): the release
# pull request lives on develop, main only tags and publishes, so main holds no commit develop lacks.
name: Release

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # The cargo tools of the Rust checks, the same as ci.yml's (EN-069, EN-111).
  CARGO_LLVM_COV_VERSION: 0.9.1
  CARGO_DENY_VERSION: 0.20.2
  # No incremental build: its state, kept for the workspace's own crates only, would grow the cache
  # and never be reused, those crates being compiled again in each run.
  CARGO_INCREMENTAL: 0

jobs:
  # On main: saves the Rust caches the next pull request into main restores (EN-111). A cache saved
  # by a pull request's run is scoped to its merge ref and never restored by the next pull request;
  # one saved on the default branch is restored by every run (`REF-GH-CACHE`). It builds what the
  # CI's `check:all` compiles, with the same commands and flags, and checks nothing: the tests are
  # compiled and listed, never run (ADR-0072: nothing is re-checked after the merge). Its keys and
  # paths are ci.yml's. Without `restore-keys`, a new key starts from an empty target/, which so
  # never keeps the artifacts of an older Cargo.lock.
  rust-cache:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        run: echo "name=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)-x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
      - id: tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain.outputs.name }}
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/bin/cargo-deny
          key: rust-tools-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}
      - if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }} cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # The compilations of `rust:build` and `check:rust` (package.json): the release binaries,
      # Clippy, the tests under coverage, the Windows check.
      - run: npm run rust:build
      - run: cargo clippy --workspace --all-targets --locked --quiet
      - run: cargo llvm-cov --workspace --locked --no-report -- --list
      - run: cargo check --workspace --all-targets --locked --quiet --target x86_64-pc-windows-msvc

  # On develop: opens or updates the release pull request (`chore(develop): release x.y.z`), never a
  # release (`REF-RELEASE-PLEASE-UPGRADE`). The Product Owner merges it when they ask for a release,
  # before the pull request develop → main. Nothing opens while a merged one waits for its tag
  # (`REF-RELEASE-PLEASE-SOURCE`).
  release-pr:
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Personal access token (docs/tooling/releases.md).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: develop
          skip-github-release: true

  # On main: tags and publishes the release pull request merged into develop, now held by main; opens
  # no pull request. Its target branch is develop, where release-please looks for the merged release
  # pull request whose merge commit it tags (`REF-RELEASE-PLEASE-SOURCE`, `REF-RELEASE-PLEASE-DESIGN`).
  release-please:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: develop
          skip-github-pull-request: true

  # Attaches to the GitHub release the test results of the released code (ADR-0027): the report of
  # the CI of the last pull request merged into main, not a new run (ADR-0038).
  test-report:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the report of the last pull request into main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --workflow ci.yml --event pull_request --status success --limit 20 \
            --json databaseId,headBranch \
            --jq 'map(select(.headBranch | startswith("release-please--") | not))[0].databaseId')
          gh run download "$run_id" --name test-report
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" test-report.xml --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Publishes the documentation site when a version is released (or on manual run).
  # Runs here because a release created with GITHUB_TOKEN triggers no other workflow.
  docs:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The rust-cache job's caches, restored only (`REF-GH-CACHE-RESTORE`): the API pages' build
      # runs Rust binaries, compiled on them; that job, running beside this one, saves them.
      - id: toolchain
        run: echo "name=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)-x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain.outputs.name }}
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/bin/cargo-deny
          key: rust-tools-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-build-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
      - run: npm run playground:build
        env:
          PLAYGROUND_BASE: /${{ github.event.repository.name }}/playground/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
      - id: deploy
        uses: actions/deploy-pages@v5
