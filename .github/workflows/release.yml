# The release, by its button alone (docs/tooling/releases.md, ADR-0086, ADR-0088): the Actions
# tab's _Run workflow_ (`workflow_dispatch`, `REF-GH-WORKFLOW-DISPATCH`) on main makes the release,
# its version from the last tag and the commits since, with no commit. `release publish` refuses
# any other branch. The site is deployed by site.yml, the Rust caches saved by rust-caches.yml.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The versions in the cargo tools' key, the same as ci.yml's (EN-069, EN-111).
  CARGO_LLVM_COV_VERSION: 0.9.1
  CARGO_DENY_VERSION: 0.20.2
  CARGO_INCREMENTAL: 0

jobs:
  # `release publish` checks that the run is on the branch main (`GITHUB_REF`, `REF-GH-VARIABLES`),
  # computes the version from the last tag `vx.y.z` and the commits since, and makes the GitHub
  # release on main's head, which GitHub tags: its notes the bodies of the pull requests into main
  # merged since that tag, the test report of the last one's CI attached (ADR-0027, ADR-0072: the
  # report of the code released, not a new run). It makes no commit; without a commit since the
  # last tag it does nothing. GITHUB_TOKEN suffices: nothing has to start from the release, the
  # site being deployed by the push.
  release:
    runs-on: ubuntu-latest
    # The CI's report downloaded, the release made, the bodies read (`REF-GH-JOB-PERMISSIONS`).
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit and tag (`REF-GH-CHECKOUT`): the last tag, the commits since and the
          # merges of the pull requests; the head's second parent is the last one's head.
          fetch-depth: 0
      # The Rust caches, restored only (`REF-GH-CACHE-RESTORE`): the release tool is compiled on
      # the build site.yml saved at the push to main of the head released (`REF-GH-CACHE`).
      - id: toolchain
        run: echo "name=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)-x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.toolchain.outputs.name }}
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/bin/cargo-deny
          key: rust-tools-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-build-${{ runner.os }}-
      - run: cargo build --release --locked -q -p release
      - run: target/release/release publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
