# cargo-deny's configuration (EN-069, REF-CARGO-DENY-ADVISORIES): only its advisories check runs,
# `cargo deny --offline check advisories` in check:rust, after `cargo deny fetch db` in the CI. Its
# defaults hold the rest: the RustSec database, unmaintained crates failing, no advisory ignored.
[advisories]
# A yanked crate fails too, where the default only warns.
yanked = "deny"
